; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/ensure_pio_python_deps.py
lib_deps =
	sandeepmistry/LoRa @ ^0.8.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.4.0
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9

; Native environment for running pure-logic unit tests on the host (no
; ESP32 toolchain, no hardware). main.cpp depends on Arduino/ESP32 headers
; so it's excluded here; only hardware-independent sources (payload.cpp)
; are built against the tests.
[env:native]
platform = native
test_framework = unity
build_src_filter = +<*> -<main.cpp>
test_build_src = true
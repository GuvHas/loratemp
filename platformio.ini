; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:ttgo-lora32-v21]
platform = espressif32
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
extra_scripts =
    pre:scripts/ensure_pio_python_deps.py
    pre:scripts/inject_git_version.py
lib_deps =
	sandeepmistry/LoRa @ ^0.8.0
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays @ ^4.4.0
    adafruit/DHT sensor library @ ^1.4.4
    adafruit/Adafruit Unified Sensor @ ^1.1.9

; Native environment for running pure-logic unit tests on the host (no
; ESP32 toolchain, no hardware). main.cpp and hal_esp32.cpp depend on
; Arduino/ESP32/LoRa/DHT/SSD1306 headers so they're excluded here; only
; hardware-independent sources (payload.cpp, orchestrator.cpp) are built
; against the tests, using the fakes in test/ for hal.h's interfaces.
;
; Deliberately does NOT run scripts/inject_git_version.py: the real git hash
; has no test-relevant meaning here, and payload.cpp's NODE_FW_VERSION falls
; back to "dev" when it isn't injected, so tests assert against that fixed
; fallback value instead.
[env:native]
platform = native
test_framework = unity
build_src_filter = +<*> -<main.cpp> -<hal_esp32.cpp>
test_build_src = true